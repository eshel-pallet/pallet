<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>에셀 공정관리 (시험판)</title>
<meta name="theme-color" content="#1f3a5f">
<style>
:root{--f:1;--navy:#1f3a5f;--line:#c9d1db;--yellow:#ffe94d;--orange:#ffd8a8;--ink:#14213d;--mute:#7a8699}
*{box-sizing:border-box}
body{margin:0;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:var(--ink);background:#eef1f5}
body.home{display:block;overflow:auto}
header{flex:none;background:var(--navy);color:#fff;padding:8px 14px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
header h1{font-size:18px;margin:0}
header .sub{font-size:13px;opacity:.9}
.chips{display:flex;gap:8px;align-items:center;margin-left:auto;flex-wrap:wrap}
.net{font-size:11px;padding:2px 8px;border-radius:10px;background:#2f9e44;color:#fff;font-weight:700}.net.bad{background:#c0392b}
.hb{font-size:15px;padding:5px 12px;border:0;border-radius:6px;background:#fff;color:var(--navy);font-weight:800;cursor:pointer;font-family:inherit}
.hb.on{background:var(--yellow)}
#modes{flex:none;display:flex;gap:6px;background:#0f2540;padding:6px 8px}
#modes button{flex:1;border:0;border-radius:8px;padding:7px 4px;background:#dfe7f2;color:var(--navy);font-weight:900;font-size:18px;line-height:1.25;cursor:pointer;font-family:inherit}
#modes button small{display:block;font-weight:700;font-size:12px;color:#44546a}
#modes button.on{background:var(--yellow)}
#tools{flex:none;background:#16304f;padding:6px 8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;color:#fff;font-size:13px}
#tools button{font-size:15px;font-weight:800;padding:2px 12px;border:0;border-radius:14px;background:#dfe7f2;color:var(--navy);cursor:pointer;font-family:inherit}
#tools button.on{background:var(--yellow)}
#tools .lg{display:inline-flex;align-items:center;gap:5px;margin-left:8px;font-weight:700}
#tools .lg i{width:14px;height:14px;border-radius:3px;display:inline-block}
#tools .tagb{margin-left:auto}
.wrap{overflow:auto;flex:1;min-height:0;background:#fff}
body.selmode .wrap{padding-bottom:170px}
.list{padding:6px 8px}
.pr{display:flex;align-items:stretch;border:1px solid var(--line);border-left:10px solid var(--mc,#8a97a8);border-radius:10px;margin:0 0 6px;background:#fff;cursor:pointer}
.pr .no{flex:none;width:calc(132px*var(--f));display:flex;align-items:center;justify-content:center;font-weight:900;font-size:calc(19px*var(--f));color:var(--navy);background:#f1f4f9;padding:0 6px;text-align:center}
.pr .mid{flex:1;min-width:0;padding:7px 14px;display:flex;flex-direction:column;justify-content:center}
.pr .sz{font-weight:900;font-size:calc(28px*var(--f));line-height:1.15;color:var(--navy)}
.pr .sz .mat{margin-left:18px;color:var(--mt,#44546a)}
.pr .meta{margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:calc(13px*var(--f));color:#44546a;font-weight:700}
.bd{border-radius:6px;padding:1px 8px;font-weight:900;font-size:calc(13px*var(--f))}
.bd.bor{background:#ece9fd;color:#3c3489}
.bd.cut{background:#e5e8ee;color:#6b7686}.bd.cut.part{background:var(--orange);color:#a24400}.bd.cut.done{background:#d3f3da;color:#1d6b2f}
.pr .q{flex:none;width:calc(190px*var(--f));display:flex;flex-direction:column;align-items:center;justify-content:center;border-left:1px solid var(--line);border-radius:0 10px 10px 0;padding:4px}
.pr .q b{font-weight:900;font-size:calc(34px*var(--f));line-height:1.05}
.pr .q small{font-size:calc(13px*var(--f));color:#5b6b82;font-weight:700}
.pr.part .q{background:var(--orange)}.pr.part .q b{color:#a24400}
.pr.done .q{background:var(--yellow)}.pr.done .q b{color:#2e6b00}
.pr.done{opacity:.8}
.pr.sel{outline:4px solid #1c7ed6;outline-offset:-4px}
.empty{padding:30px;text-align:center;color:var(--mute)}
#modal{position:fixed;inset:0;background:rgba(10,20,40,.55);display:none;align-items:center;justify-content:center;z-index:50}
#modal .box{background:#fff;border-radius:14px;padding:18px 20px;width:min(480px,94vw);max-height:92vh;overflow:auto;box-shadow:0 8px 30px rgba(0,0,0,.35)}
#modal h2{margin:0 0 4px;font-size:19px}
#modal .info{color:#44546a;margin-bottom:8px;font-size:14px;line-height:1.5}
#modal .big{font-size:15px;margin:6px 0 12px}
.btn{display:block;width:100%;padding:13px;font-size:18px;font-weight:800;border:0;border-radius:10px;margin-bottom:9px;cursor:pointer;font-family:inherit}
.btn.ok{background:#2f9e44;color:#fff}.btn.sec{background:#e8edf4;color:var(--navy)}.btn.warn{background:#fff0f0;color:#b02a2a}
.btn:disabled{opacity:.35;cursor:default}
.row{display:flex;gap:8px;margin-bottom:9px}
.row input{flex:1;min-width:0;font-size:22px;padding:9px;border:2px solid #aab6c8;border-radius:10px;text-align:center}
.row .btn{width:130px;margin:0}
.msg{color:#b02a2a;font-weight:700;min-height:20px;font-size:14px}
.lbl{font-size:13px;color:#5b6b82;margin:8px 0 3px}
.tagnote{background:#eef6ff;border:1px solid #9cc3f0;border-radius:8px;padding:6px 10px;margin:4px 0 10px;font-size:13px;font-weight:700;color:#1f3a5f}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:none;gap:8px;padding:8px 10px;background:#0f2540;align-items:center;flex-wrap:wrap;box-shadow:0 -4px 14px rgba(0,0,0,.35)}
#bar .btn{width:auto;flex:1;margin:0;min-width:140px;padding:11px;font-size:17px}
#bar .bm{color:#ffd8a8;font-size:14px;flex-basis:100%;font-weight:700}
#toast{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#14213d;color:#fff;padding:10px 16px;border-radius:10px;z-index:80;font-weight:700;display:none;max-width:92vw}
#home{max-width:760px;margin:0 auto;padding:16px;min-height:100vh;display:flex;flex-direction:column}
.hero{background:#1f3a5f;color:#fff;border-radius:18px;padding:20px;margin:2px 0 16px}
.hero .brand{display:inline-block;font-size:12px;font-weight:900;letter-spacing:2px;background:rgba(255,255,255,.16);border-radius:20px;padding:3px 12px;margin-bottom:8px}
.hero h1{margin:0 0 4px;font-size:26px}.hero .s{font-size:14px;opacity:.85}
.card{display:block;width:100%;text-align:left;background:#fff;border:2px solid #c9d1db;border-left:9px solid #534AB7;border-radius:14px;padding:14px 16px;margin-bottom:12px;cursor:pointer;font-family:inherit}
.card .po{font-size:15px;color:#5b6b82;font-weight:700}
.card .kd{float:right;font-size:13px;font-weight:900;border-radius:20px;padding:2px 12px;color:#fff;background:#534AB7}
.card .nm{font-size:21px;font-weight:900;color:var(--navy);margin:2px 0 8px}
.card .pg{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:700;color:#44546a;margin-top:4px}
.card .pg span{width:44px}.card .pg em{font-style:normal;width:130px;text-align:right}
.bar2{flex:1;height:10px;background:#e5e9f0;border-radius:6px;overflow:hidden}.bar2 i{display:block;height:100%;background:#2f9e44}
.foot{margin-top:auto;padding:28px 0 14px;text-align:center;color:var(--mute);font-size:12px;line-height:1.75}
.foot .ttl{font-size:18px;font-weight:800;color:var(--ink)}
.apiset input{width:100%;font-size:15px;padding:8px;margin:6px 0}
/* A5 태그 (B안: 칸 이름·고정 정보는 보통 글씨, 사이즈·수량·No.만 아주 굵게) */
#print{display:none}
.tag{width:148mm;height:210mm;padding:14mm 12mm;page-break-after:always;font-family:"Malgun Gothic",sans-serif;color:#000}
.tag:last-child{page-break-after:auto}
.tag table{width:100%;border-collapse:collapse}
.tag td{border:1.2px solid #000;text-align:center;padding:3.2mm 2mm;font-size:15pt;font-weight:400}
.tag td.h{width:32%}
.tag .top{font-size:22pt}
.tag .e{font-size:30pt;font-weight:900;letter-spacing:.5px}
.tag .no{text-align:center;margin-top:9mm;font-size:30pt;font-weight:900}
.tag .nm{font-size:12.5pt}
@media print{
 @page{size:A5 portrait;margin:0}
 body,body.home{display:block;height:auto;overflow:visible;background:#fff}
 body>*:not(#print){display:none!important}
 #print{display:block}
}
</style></head><body class="home">
<div id="home"></div>
<header id="hd" style="display:none">
 <button class="hb" onclick="goHome()">◀ 현장 목록</button>
 <h1 id="ht"></h1><div class="sub" id="s"></div>
 <div class="chips"><span class="net" id="net">연결됨</span>
 <button class="hb" id="selbtn" onclick="toggleSel()">여러 칸 선택</button>
 <button class="hb" onclick="zoom(-.1)">글씨 −</button><button class="hb" onclick="zoom(.1)">글씨 +</button></div>
</header>
<div id="modes" style="display:none"></div>
<div id="tools" style="display:none"></div>
<div class="wrap" id="wrap" style="display:none"></div>
<div id="bar"></div>
<div id="toast"></div>
<div id="modal"><div class="box" id="mb"></div></div>
<div id="print"></div>
<script>
let API='__API__';
if(API.indexOf('__API')===0){API='';try{const q=new URLSearchParams(location.search).get('api');if(q)localStorage.setItem('apiUp',q);API=localStorage.getItem('apiUp')||'';}catch(e){}}
const APP_VER='0.1',APP_DATE='2026.11.27';
const MC=[['#1D9E75','#0F6E56'],['#BA7517','#854F0B'],['#534AB7','#3C3489'],['#D4537E','#993556'],['#378ADD','#185FA5'],['#639922','#3B6D11']];
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}};
async function get(q){const r=await fetch(API+(API.indexOf('?')>=0?'&':'?')+q);return r.json();}
async function post(o){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(o)});return r.json();}
function netOk(ok){const n=$('net');n.textContent=ok?'연결됨':'연결 끊김 - 다시 시도 중';n.className='net'+(ok?'':' bad');}
function toast(t,ms){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',ms||4000);}
let SITE=null,PARTS=[],DONE={},PO='',proc='',onlyLeft=false,timer=null,cur=null,busy=false,selMode=false,sel=new Set(),lastBatch=null,bmsg='',matIdx={};
const K=(pr,no)=>PO+'|'+pr+'|'+no;
const dOf=(pr,p)=>DONE[K(pr,p.no)]||0;
const sizeTxt=p=>`${p.l} × ${p.w}`;
const tagOn=()=>ls('tagOn')!=='0';

// ---------- 현장 목록 ----------
function showHome(){
 clearInterval(timer);document.body.className='home';['hd','modes','tools','wrap','bar'].forEach(i=>$(i).style.display='none');$('home').style.display='flex';
 const foot=`<div class="foot"><div class="ttl">에셀 공정관리</div><div>화면 ${APP_VER} · ${APP_DATE} · <span id="sver">서버 확인 중…</span></div><div>업그레이드 시험판 — 운영 중인 체크리스트와 별개입니다</div></div>`;
 if(!API){$('home').innerHTML=`<div class="hero"><div class="brand">ESHEL · 시험판</div><h1>에셀 공정관리</h1><div class="s">서버 주소를 먼저 넣어 주세요</div></div>
  <div class="apiset">시험 서버 주소 (https://script.google.com/macros/s/…/exec)<input id="apiin" placeholder="https://script.google.com/macros/s/…/exec"><button class="btn ok" onclick="saveApi()">저장</button></div>`+foot;return;}
 $('home').innerHTML=`<div class="hero"><div class="brand">ESHEL · 시험판</div><h1>에셀 공정관리</h1><div class="s">진척과 실적 · 현장을 누르세요</div></div><div id="list">불러오는 중…</div>`+foot;
 const load=async()=>{try{const r=await get('action=sites');if(!r.ok)throw 0;$('sver').textContent='서버 '+r.ver;
  $('list').innerHTML=r.sites.length?r.sites.map(s=>`<button class="card" onclick="openSite('${esc(s.po)}')"><span class="kd">${esc(s.item)} · ${esc(s.cls)}</span><div class="po">PO ${esc(s.po)}</div><div class="nm">${esc(s.name)}</div>
   ${s.prog.map(g=>`<div class="pg"><span>${esc(g.proc)}</span><div class="bar2"><i style="width:${g.total?g.done/g.total*100:0}%"></i></div><em>${g.done.toLocaleString()} / ${g.total.toLocaleString()}장</em></div>`).join('')}</button>`).join(''):'<div class="empty">등록된 현장이 없습니다</div>';
 }catch(e){$('list').innerHTML='<div class="empty">서버에 연결되지 않습니다</div>';$('sver').textContent='서버 연결 안 됨';}};
 load();timer=setInterval(load,15000);
}
function saveApi(){const v=($('apiin').value||'').trim();if(!v.startsWith('http')){alert('https:// 로 시작하는 주소를 붙여 넣어 주세요');return;}ls('apiUp',v);API=v;showHome();}
function goHome(){location.hash='';}
function openSite(po){location.hash='#'+encodeURIComponent(po);}
window.addEventListener('hashchange',route);
function route(){const h=decodeURIComponent(location.hash.slice(1));if(h)loadSite(h);else showHome();}

// ---------- 현장 화면 ----------
async function loadSite(po){
 clearInterval(timer);PO=po;selMode=false;sel.clear();lastBatch=null;bmsg='';document.body.className='';$('home').style.display='none';
 ['hd','modes','tools','wrap'].forEach(i=>$(i).style.display='');$('bar').style.display='none';$('selbtn').className='hb';$('selbtn').textContent='여러 칸 선택';
 $('wrap').innerHTML='<div class="empty">불러오는 중…</div>';
 try{const r=await get('action=site&po='+encodeURIComponent(po));if(!r.ok){$('wrap').innerHTML='<div class="empty">'+esc(r.msg)+'</div>';return;}
  SITE=r.site;PARTS=r.parts;DONE=r.done;netOk(true);
  matIdx={};PARTS.forEach(p=>{if(!(p.mat in matIdx))matIdx[p.mat]=Object.keys(matIdx).length;});
  proc=SITE.procs[0];onlyLeft=false;
  $('ht').textContent=SITE.name;$('s').textContent=`PO ${SITE.po} · ${SITE.item} · ${SITE.cls}`;
  refresh();timer=setInterval(poll,10000);
 }catch(e){netOk(false);$('wrap').innerHTML='<div class="empty">서버에 연결되지 않습니다</div>';}
}
async function poll(){if(busy||!PO)return;try{const r=await get('action=state&po='+encodeURIComponent(PO));if(!r.ok){netOk(false);return;}netOk(true);
 if(JSON.stringify(r.done)!==JSON.stringify(DONE)){DONE=r.done;pruneSel();refresh();}}catch(e){netOk(false);}}
function partsOf(pr){return PARTS.filter(p=>p.procs.indexOf(pr)>=0);}
function refresh(){renderModes();renderTools();renderList();updateBar();if(cur)renderModal();}
function renderModes(){
 $('modes').innerHTML=SITE.procs.map(pr=>{const ps=partsOf(pr),t=ps.reduce((a,p)=>a+p.q,0),d=ps.reduce((a,p)=>a+Math.min(p.q,dOf(pr,p)),0),n=ps.filter(p=>dOf(pr,p)>=p.q).length;
  return `<button class="${pr===proc?'on':''}" onclick="setProc('${pr}')">${pr}<small>${n} / ${ps.length} No. 완료 · ${d.toLocaleString()} / ${t.toLocaleString()}장</small></button>`;}).join('');
}
function setProc(pr){if(pr===proc)return;proc=pr;sel.clear();bmsg='';lastBatch=null;refresh();$('wrap').scrollTop=0;}
function renderTools(){
 const mats=Object.keys(matIdx);
 $('tools').innerHTML=`<button class="${onlyLeft?'':'on'}" onclick="onlyLeft=false;refresh()">전체</button><button class="${onlyLeft?'on':''}" onclick="onlyLeft=true;refresh()">남은 것만</button>`+
  mats.map(m=>`<span class="lg"><i style="background:${MC[matIdx[m]%MC.length][0]}"></i>${esc(m)}</span>`).join('')+
  (proc==='재단'?`<button class="tagb ${tagOn()?'on':''}" onclick="ls('tagOn',tagOn()?'0':'1');refresh()">A5 태그 인쇄 ${tagOn()?'켜짐':'꺼짐'}</button>`:'');
}
function rowHtml(p){
 const d=dOf(proc,p),q=p.q,done=d>=q,part=!done&&d>0,c=MC[matIdx[p.mat]%MC.length];
 let meta='';
 if(p.f&&p.f['부재']&&p.f['부재']!=='뒷판')meta+=`<span>${esc(p.f['부재'])}</span>`;
 if(p.f&&p.f['개소'])meta+=`<span class="bd bor">보링 ${p.f['개소']}개소</span>`;
 if(proc!=='재단'&&p.procs.indexOf('재단')>=0){const cd=dOf('재단',p),cc=cd>=q?'done':cd>0?'part':'';meta+=`<span class="bd cut ${cc}">재단 ${cd}/${q}${cc==='done'?' ✔':''}</span>`;}
 return `<div class="pr ${done?'done':part?'part':''} ${sel.has(p.no)?'sel':''}" style="--mc:${c[0]};--mt:${c[1]}" onclick="clickRow('${esc(p.no)}')">
  <div class="no">${esc(p.no)}</div>
  <div class="mid"><div class="sz">${sizeTxt(p)}<span class="mat">${esc(p.mat)}</span></div>${meta?`<div class="meta">${meta}</div>`:''}</div>
  <div class="q"><b>${done?'✔ '+q:d+' / '+q}</b><small>${done?'완료':part?'남은 '+(q-d)+'장':'장'}</small></div></div>`;
}
function renderList(){
 const keep=$('wrap').scrollTop;const L=partsOf(proc).filter(p=>!onlyLeft||dOf(proc,p)<p.q);
 $('wrap').innerHTML='<div class="list">'+(L.length?L.map(rowHtml).join(''):'<div class="empty">해당하는 줄이 없습니다</div>')+'</div>';$('wrap').scrollTop=keep;
}
function zoom(dv){const r=document.documentElement;const v=Math.max(.7,Math.min(1.6,(parseFloat(r.style.getPropertyValue('--f'))||1)+dv));r.style.setProperty('--f',v.toFixed(2));ls('zoomUp',v.toFixed(2));}
function partBy(no){return PARTS.find(p=>p.no===no);}
function clickRow(no){const p=partBy(no);if(!p)return;
 if(selMode){if(dOf(proc,p)>=p.q)return;sel.has(no)?sel.delete(no):sel.add(no);bmsg='';refresh();return;}
 cur={no};openModal();}

// ---------- 입력창 ----------
function openModal(){$('mb').innerHTML='';renderModal();$('modal').style.display='flex';}
function renderModal(){
 if(!cur)return;const p=partBy(cur.no);if(!p){closeM();return;}const q=p.q,d=dOf(proc,p),left=q-d,tg=proc==='재단'&&tagOn();
 const keep=$('n')?$('n').value:'',keepM=$('m')?$('m').textContent:'';
 $('mb').innerHTML=`<h2>${esc(proc)} · ${esc(p.no)}</h2><div class="info" style="font-size:30px;font-weight:900;color:var(--navy)">${sizeTxt(p)}</div>
 <div class="info">${esc(p.mat)} · ${p.t}T${p.f&&p.f['개소']?` · 보링 ${p.f['개소']}개소`:''}${proc!=='재단'&&p.procs.indexOf('재단')>=0?` · 재단 ${dOf('재단',p)}/${q}`:''}</div>
 ${tg?`<div class="tagnote">입력하면 그 수량으로 A5 태그가 1장 인쇄됩니다</div>`:''}
 <div class="big">전체 <b>${q}</b>장 · 지금까지 <b>${d}</b> · <b style="color:#c0392b">남은 ${left}</b></div>
 <button class="btn ok" ${left===0||busy?'disabled':''} onclick="act('add',${left})">전부 완료 (남은 ${left}장)</button>
 <div class="lbl">일부만 했을 때 — 이번에 ${proc==='재단'?'적재한':'한'} 장수</div>
 <div class="row"><input id="n" type="number" inputmode="numeric" min="1" placeholder="장수" value="${esc(keep)}"><button class="btn sec" ${busy?'disabled':''} onclick="act('add',parseInt($('n').value))">추가</button></div>
 <div class="msg" id="m">${esc(keepM)}</div>
 <button class="btn warn" ${d>0&&!busy?'':'disabled'} onclick="act('undo')">직전 입력 취소</button>
 <div class="lbl">수량 직접 수정 — 지금까지 한 장수 (태그는 나오지 않습니다)</div>
 <div class="row"><input id="e" type="number" inputmode="numeric" min="0" max="${q}" value="${d}"><button class="btn sec" ${busy?'disabled':''} onclick="act('set',parseInt($('e').value))">저장</button></div>
 <button class="btn sec" onclick="closeM()">닫기</button>`;
}
function closeM(){$('modal').style.display='none';cur=null;$('mb').innerHTML='';}
function msg(t){const m=$('m');if(m)m.textContent=t;}
async function act(kind,v){
 if(!cur||busy)return;const p=partBy(cur.no),q=p.q;
 if(kind==='add'&&!(v>0)){msg('장수를 입력해 주세요');return;}
 if(kind==='set'&&!(v>=0&&v<=q)){msg(`0~${q} 사이로 입력해 주세요`);return;}
 busy=true;renderModal();
 const body={action:kind,po:PO,proc,no:p.no};if(kind==='add')body.n=v;if(kind==='set')body.value=v;
 try{const res=await post(body);busy=false;
  if(res.d!==undefined)DONE[K(proc,p.no)]=res.d;
  if(res.ok){netOk(true);closeM();refresh();if(kind==='add'&&proc==='재단'&&tagOn())printTags([{p,n:res.added}]);}
  else{refresh();renderModal();msg(res.msg||'저장하지 못했습니다');}
 }catch(e){busy=false;netOk(false);renderModal();msg('서버에 연결되지 않아 저장되지 않았습니다. 다시 눌러 주세요.');}
}
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeM();});

// ---------- 여러 칸 선택 ----------
function pruneSel(){[...sel].forEach(no=>{const p=partBy(no);if(!p||dOf(proc,p)>=p.q)sel.delete(no);});}
function toggleSel(){selMode=!selMode;if(!selMode){sel.clear();bmsg='';}document.body.classList.toggle('selmode',selMode);$('selbtn').className='hb'+(selMode?' on':'');$('selbtn').textContent=selMode?'선택 모드 끄기':'여러 칸 선택';refresh();}
function updateBar(){
 const b=$('bar');if(!selMode){b.style.display='none';return;}b.style.display='flex';const n=sel.size;
 b.innerHTML=(bmsg?`<div class="bm">${esc(bmsg)}</div>`:'')+
 `<button class="btn ok" ${n&&!busy?'':'disabled'} onclick="bulkDone()">${n?`선택한 ${n}줄 전부 완료${proc==='재단'&&tagOn()?` (태그 ${n}장)`:''}`:'완료할 줄을 눌러 선택하세요'}</button>`+
 `<button class="btn sec" ${n?'':'disabled'} onclick="sel.clear();bmsg='';refresh()">선택 해제</button>`+
 (lastBatch?`<button class="btn warn" ${busy?'disabled':''} onclick="bulkUndo()">방금 일괄 입력 취소</button>`:'');
}
async function bulkDone(){
 if(!sel.size||busy)return;const items=[...sel].map(no=>({proc,no}));busy=true;bmsg='';updateBar();
 try{const res=await post({action:'bulk',po:PO,items});busy=false;
  if(res.ok){res.cells.forEach(c=>DONE[K(c.proc,c.no)]=c.d);sel.clear();lastBatch=res.batch;bmsg=res.cells.length+'줄 완료했습니다';netOk(true);
   if(proc==='재단'&&tagOn())printTags(res.cells.map(c=>({p:partBy(c.no),n:c.added})));}
  else{bmsg=res.msg||'저장하지 못했습니다';poll();}
 }catch(e){busy=false;netOk(false);bmsg='서버에 연결되지 않아 저장되지 않았습니다. 다시 눌러 주세요.';}
 refresh();
}
async function bulkUndo(){
 if(!lastBatch||busy)return;busy=true;updateBar();
 try{const res=await post({action:'bulkundo',batch:lastBatch});busy=false;
  if(res.ok){res.cells.forEach(c=>DONE[K(c.proc,c.no)]=c.d);bmsg=res.cells.length+'줄을 되돌렸습니다 (이미 나온 태그는 버려 주세요)';lastBatch=null;}else bmsg=res.msg||'되돌리지 못했습니다';
 }catch(e){busy=false;bmsg='서버에 연결되지 않았습니다. 다시 눌러 주세요.';}
 refresh();
}

// ---------- A5 태그 ----------
function tagHtml(p,n){
 return `<div class="tag"><table>
 <tr><td colspan="2" class="top">${esc(SITE.item)}</td></tr>
 <tr><td class="h">P O</td><td>${esc(SITE.po)}</td></tr>
 <tr><td class="h">현장명</td><td class="nm">${esc(SITE.name)}</td></tr>
 <tr><td class="h">시트넘버</td><td>${esc(p.mat)}</td></tr>
 <tr><td colspan="2">${esc(SITE.cls)}</td></tr>
 <tr><td class="h">사이즈</td><td class="e">${p.l} X ${p.w}</td></tr>
 <tr><td class="h">수량</td><td><span class="e">${n}</span> 개</td></tr>
 </table><div class="no">${esc(p.no)}</div></div>`;
}
function printTags(list){
 list=list.filter(x=>x.p&&x.n>0);if(!list.length)return;
 $('print').innerHTML=list.map(x=>tagHtml(x.p,x.n)).join('');
 setTimeout(()=>{window.print();},50);
}
window.addEventListener('afterprint',()=>{$('print').innerHTML='';});

const z=ls('zoomUp');if(z)document.documentElement.style.setProperty('--f',z);
route();
</script></body></html>
