<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QR 읽기 시험 v2</title>
<style>
body{margin:0;font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#111;color:#eee;font-size:15px}
h1{font-size:18px;margin:0;padding:12px 14px;background:#1f3864}
.pad{padding:10px 14px}
button{font-size:17px;padding:12px 16px;border-radius:10px;border:0;background:#2f5597;color:#fff;margin:4px 6px 4px 0}
button.alt{background:#555}
.cam{position:relative;background:#000;width:100%;max-height:42vh;overflow:hidden}
video{width:100%;max-height:42vh;object-fit:contain;display:block;background:#000}
.res{margin:10px 0;padding:12px;border-radius:10px;background:#222;font-size:16px;word-break:break-all}
.res.ok{background:#1b5e20}
pre{white-space:pre-wrap;word-break:break-all;font-size:12.5px;line-height:1.5;background:#1b1b1b;padding:10px;border-radius:8px;margin:8px 0}
.hint{color:#aaa;font-size:13px}
</style>
</head>
<body>
<h1>QR 읽기 시험 v2 (아이폰 확인용)</h1>
<div class="pad">
  <div class="hint">1) 「카메라 시작」을 누르고 카메라 사용을 허용합니다. 2) 파렛트 QR을 비춥니다. 3) 아래 화면 전체를 캡처해서 보내 주세요.</div>
  <button id="go">카메라 시작</button>
  <button id="photoBtn" class="alt">사진으로 읽기</button>
  <input type="file" id="photoIn" accept="image/*" capture="environment" style="display:none">
</div>
<div class="cam"><video id="v" playsinline muted autoplay></video></div>
<div class="pad">
  <div class="res" id="res">아직 읽힌 QR이 없습니다</div>
  <pre id="st">준비 중...</pre>
  <pre id="log"></pre>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>

<script>
// ---- 아이폰용 QR 해독 (인쇄 줄무늬 대응): zbar + jsQR, 흑백 변환 여러 단계
const DEC = {zbar:null, msg:"", loading:null};
async function loadDecoders(){
  if (DEC.loading) return DEC.loading;
  DEC.loading = (async () => {
    const zs = ["https://cdn.jsdelivr.net/npm/@undecaf/zbar-wasm@0.11.0/dist/index.mjs", "https://fastly.jsdelivr.net/npm/@undecaf/zbar-wasm@0.11.0/dist/index.mjs", "https://unpkg.com/@undecaf/zbar-wasm@0.11.0/dist/index.mjs"];
    for (const u of zs){ try{ DEC.zbar = await import(u); break; }catch(e){} }
    if (!window.jsQR){
      for (const u of ["https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js", "https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"]){
        try{ await new Promise((res, rej) => { const s = document.createElement("script"); s.src = u; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); if (window.jsQR) break; }catch(e){}
      }
    }
    DEC.msg = (DEC.zbar ? "zbar " : "") + (window.jsQR ? "jsQR" : "");
  })();
  return DEC.loading;
}
function decOk(){ return !!(DEC.zbar || window.jsQR); }
function binarize(d, off, open, vr){
  const w = d.width, h = d.height, n = w * h, g = new Uint8Array(n), hist = new Array(256).fill(0), p = d.data;
  for (let i = 0; i < n; i++) g[i] = (p[4*i] * 77 + p[4*i+1] * 150 + p[4*i+2] * 29) >> 8;
  if (vr){                         // 세로로 번지게(가로 줄무늬를 뭉개는 효과): 세로 평균
    const g2 = new Uint8Array(n);
    for (let x = 0; x < w; x++){ let acc = 0, cnt = 0; for (let y = 0; y <= vr && y < h; y++){ acc += g[y*w+x]; cnt++; }
      for (let y = 0; y < h; y++){ g2[y*w+x] = acc / cnt; const add = y + vr + 1, rem = y - vr; if (add < h){ acc += g[add*w+x]; cnt++; } if (rem >= 0){ acc -= g[rem*w+x]; cnt--; } } }
    g.set(g2);
  }
  for (let i = 0; i < n; i++) hist[g[i]]++;
  let sum = 0; for (let i = 0; i < 256; i++) sum += i * hist[i];
  let wB = 0, sB = 0, best = 0, th = 128;
  for (let i = 0; i < 256; i++){ wB += hist[i]; if (!wB) continue; const wF = n - wB; if (!wF) break; sB += i * hist[i]; const mB = sB / wB, mF = (sum - sB) / wF, bt = wB * wF * (mB - mF) * (mB - mF); if (bt > best){ best = bt; th = i; } }
  const t = Math.max(30, Math.min(230, th + off));
  let b = new Uint8Array(n); for (let i = 0; i < n; i++) b[i] = g[i] > t ? 255 : 0;
  if (open){                       // 잡티/줄무늬 제거: 3x3 침식 후 팽창(검은 점 기준)
    const e = new Uint8Array(n), o = new Uint8Array(n);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){ let m = 0; for (let dy = -1; dy <= 1; dy++){ const yy = y + dy; if (yy < 0 || yy >= h) continue; for (let dx = -1; dx <= 1; dx++){ const xx = x + dx; if (xx < 0 || xx >= w) continue; if (b[yy*w+xx] > m) m = b[yy*w+xx]; } } e[y*w+x] = m; }
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){ let m = 255; for (let dy = -1; dy <= 1; dy++){ const yy = y + dy; if (yy < 0 || yy >= h) continue; for (let dx = -1; dx <= 1; dx++){ const xx = x + dx; if (xx < 0 || xx >= w) continue; if (e[yy*w+xx] < m) m = e[yy*w+xx]; } } o[y*w+x] = m; }
    b = o;
  }
  const out = new Uint8ClampedArray(n * 4);
  for (let i = 0; i < n; i++){ out[4*i] = out[4*i+1] = out[4*i+2] = b[i]; out[4*i+3] = 255; }
  return new ImageData(out, w, h);
}
const VARIANTS = [[1, 25, 0, 1, 0], [1, 25, 0, 1, 3], [0, 0, 0, 1, 0], [1, 25, 0, 1, 7], [1, 45, 0, 1, 0], [1, 10, 0, 1, 3], [1, 25, 1, 1, 0], [1, 25, 0, 0.6, 0], [1, 40, 0, 0.6, 2], [1, 40, 0, 1, 5]];   // [흑백화?, 기준 가산, 잡티제거?, 축소배율, 세로번짐]   // [흑백화?, 기준 가산, 잡티제거?, 축소배율]
const _sc = document.createElement("canvas"), _sx = _sc.getContext("2d", {willReadFrequently:true}), _sc2 = document.createElement("canvas"), _sx2 = _sc2.getContext("2d", {willReadFrequently:true});
function shrinkData(d, k){ if (k >= 1) return d; _sc.width = d.width; _sc.height = d.height; _sx.putImageData(d, 0, 0); const w = Math.round(d.width * k), h = Math.round(d.height * k); _sc2.width = w; _sc2.height = h; _sx2.drawImage(_sc, 0, 0, w, h); return _sx2.getImageData(0, 0, w, h); }
async function decodeVariant(d, vi){
  const [bin, off, open, k, vr] = VARIANTS[vi % VARIANTS.length];
  const base = shrinkData(d, k), img = bin ? binarize(base, off, open, vr) : base;
  if (DEC.zbar){
    try{
      const s = await DEC.zbar.scanImageData(img);
      if (s && s.length){ const q = s[0]; const t = q.decode ? q.decode() : new TextDecoder().decode(q.data); if (t) return t; }
    }catch(e){}
  }
  if (window.jsQR){
    try{ const r = jsQR(img.data, img.width, img.height, {inversionAttempts: bin ? "dontInvert" : "attemptBoth"}); if (r && r.data) return r.data; }catch(e){}
  }
  return "";
}

loadDecoders().then(()=>{window.__zbarMsg=DEC.zbar?"불러옴":"못 불러옴";});
const $ = id => document.getElementById(id);
const S = {t0: Date.now(), gum: "아직 안 함", track: "", frames: 0, jsqrMs: 0, jsqrN: 0, zbarMs: 0, zbarN: 0, last: null, vinfo: ""};
const logs = [];
function log(m){ logs.unshift(new Date().toLocaleTimeString() + " " + m); logs.length = Math.min(logs.length, 14); $("log").textContent = logs.join("\n"); }
let stream = null, running = false;
const cv = document.createElement("canvas"), cx = cv.getContext("2d", {willReadFrequently: true});

function found(engine, text, src){
  S.last = {engine, text, at: new Date().toLocaleTimeString(), src};
  $("res").className = "res ok";
  $("res").textContent = "읽힘 [" + engine + "/" + src + "] " + text;
  log("읽힘 " + engine + " " + src + ": " + text);
}

async function start(){
  log("카메라 요청");
  try{
    stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: {ideal: "environment"}, width: {ideal: 1280}, height: {ideal: 1280}}, audio: false});
    S.gum = "성공";
    const tr = stream.getVideoTracks()[0], st = tr.getSettings ? tr.getSettings() : {};
    S.track = (tr.label || "(이름없음)") + " " + (st.width || "?") + "x" + (st.height || "?") + " @" + (st.frameRate || "?");
    $("v").srcObject = stream; await $("v").play();
    running = true; loop(); zloop();
  }catch(e){
    S.gum = "실패: " + (e.name || "") + " " + (e.message || "");
    log("카메라 실패 " + S.gum);
  }
}
function grab(){
  const v = $("v"); if (!v.videoWidth || v.readyState < 2) return null;
  const w = Math.min(v.videoWidth, 1280), h = Math.round(v.videoHeight * w / v.videoWidth);
  cv.width = w; cv.height = h; cx.drawImage(v, 0, 0, w, h);
  return cx.getImageData(0, 0, w, h);
}
let tick = 0;
function loop(){
  if (!running) return;
  const img = grab();
  if (img && window.jsQR){
    S.frames++; tick++;
    const t = performance.now();
    let r = null;
    try{ r = jsQR(img.data, img.width, img.height, {inversionAttempts: tick % 3 === 0 ? "attemptBoth" : "dontInvert"}); }catch(e){ log("jsQR 오류 " + e.message); }
    S.jsqrMs += performance.now() - t; S.jsqrN++;
    if (r && r.data) found("jsQR", r.data, "화면");
  }
  setTimeout(loop, 120);
}
let zi = 0;
async function zloop(){
  if (!running) return;
  if (decOk()){
    const img = grab();
    if (img){
      const t = performance.now();
      const r = await decodeVariant(img, zi++);
      S.zbarMs += performance.now() - t; S.zbarN++;
      if (r) found("해독(방식" + ((zi - 1) % VARIANTS.length) + ")", r, "화면");
    }
  }
  setTimeout(zloop, 100);
}

// 사진으로 읽기: 전체/가운데 확대를 여러 크기로 시도
function loadImg(file){ return new Promise((res, rej) => { const u = URL.createObjectURL(file), im = new Image(); im.onload = () => { URL.revokeObjectURL(u); res(im); }; im.onerror = () => rej(new Error("사진 열기 실패")); im.src = u; }); }
async function still(file){
  if (!file) return;
  log("사진 읽는 중 " + Math.round(file.size / 1024) + "KB");
  try{
    const img = await loadImg(file), W = img.naturalWidth, H = img.naturalHeight;
    const c = document.createElement("canvas"), x = c.getContext("2d", {willReadFrequently: true});
    const plans = [[1600, 0, 0, W, H], [1100, 0, 0, W, H], [700, 0, 0, W, H]];
    [[0.6, 1100], [0.4, 800]].forEach(([f, m]) => { const w = Math.round(W * f), h = Math.round(H * f); plans.push([m, Math.round((W - w) / 2), Math.round((H - h) / 2), w, h]); });
    await loadDecoders(); let ok = false;
    for (const [m, sx, sy, sw, sh] of plans){
      const k = Math.min(1, m / Math.max(sw, sh)), w = Math.round(sw * k), h = Math.round(sh * k);
      c.width = w; c.height = h; x.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
      const d = x.getImageData(0, 0, w, h);
      for (let vi = 0; vi < VARIANTS.length && !ok; vi++){ const r = await decodeVariant(d, vi); if (r){ ok = true; found("해독(방식" + vi + ")", r, "사진 " + w + "x" + h); } }
      if (ok) break;
    }
    log("사진 " + W + "x" + H + " 결과: " + (ok ? "읽힘" : "못찾음"));
  }catch(e){ log("사진 오류 " + e.message); }
}
$("go").onclick = start;
$("photoBtn").onclick = () => $("photoIn").click();
$("photoIn").onchange = e => { const f = e.target.files && e.target.files[0]; e.target.value = ""; still(f); };

setInterval(() => {
  const v = $("v");
  $("st").textContent = [
    "기기: " + navigator.userAgent,
    "BarcodeDetector(기본 QR 읽기): " + ("BarcodeDetector" in window ? "있음" : "없음"),
    "jsQR 부품: " + (window.jsQR ? "불러옴" : "못 불러옴"),
    "zbar 부품: " + (window.__zbarMsg || "불러오는 중"),
    "카메라 요청: " + S.gum,
    "카메라 정보: " + (S.track || "-"),
    "화면: " + v.videoWidth + "x" + v.videoHeight + " · 상태 " + v.readyState + " · 멈춤 " + v.paused + " · 시간 " + v.currentTime.toFixed(1),
    "jsQR 시도 " + S.jsqrN + "회, 평균 " + (S.jsqrN ? Math.round(S.jsqrMs / S.jsqrN) : "-") + "ms",
    "zbar 시도 " + S.zbarN + "회, 평균 " + (S.zbarN ? Math.round(S.zbarMs / S.zbarN) : "-") + "ms",
    "마지막 읽힘: " + (S.last ? S.last.engine + " " + S.last.src + " " + S.last.at : "없음"),
    "경과: " + Math.round((Date.now() - S.t0) / 1000) + "초"
  ].join("\n");
}, 500);
window.addEventListener("error", e => log("오류 " + e.message));
</script>
</body>
</html>
