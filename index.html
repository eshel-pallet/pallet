<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16202a">
<title>파렛트 스캔</title>
<style>
:root{--bg:#16202a;--card:#1f2d3a;--line:#33475a;--tx:#f2f6fa;--sub:#9fb2c4;--ok:#1fb874;--warn:#f5a524;--bad:#ef5350;--pri:#3b82f6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,"Malgun Gothic",sans-serif}
button{font:inherit;color:inherit}
.screen{display:none;min-height:100%;flex-direction:column}
.screen.on{display:flex}
h1{font-size:22px;margin:0}
.pad{padding:16px}
.big{width:100%;border:0;border-radius:16px;padding:22px 16px;font-size:24px;font-weight:700;background:var(--card);border:2px solid var(--line);margin-top:12px}
.big.pack{background:#12503a;border-color:var(--ok)}
.big.ship{background:#1d3557;border-color:var(--pri)}
.big:disabled{opacity:.4}
.top{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#0f1822;border-bottom:1px solid var(--line)}
.top .grow{flex:1;font-weight:700}
.pill{border-radius:99px;padding:6px 12px;font-size:14px;background:var(--card);border:1px solid var(--line)}
.pill.warn{background:#5a3b00;border-color:var(--warn)}
.pill.bad{background:#5a1f1f;border-color:var(--bad)}
.cam{position:relative;background:#000;aspect-ratio:1/1;max-height:40vh;transition:max-height .2s;width:100%;overflow:hidden}
.cam video{width:100%;height:100%;object-fit:cover}
.cam .aim{position:absolute;inset:18%;border:3px solid rgba(255,255,255,.75);border-radius:18px;pointer-events:none}
.cam .msg{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:15px;color:#fff;text-shadow:0 1px 3px #000}
.working .cam{max-height:15vh}
.working .cam .msg{display:none}
.stick{position:sticky;bottom:0;background:var(--bg);padding:10px 0 calc(10px + env(safe-area-inset-bottom));margin-top:10px}
.row{display:flex;gap:8px;margin-top:10px}
.row>*{flex:1}
.btn{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:14px 10px;font-size:18px;font-weight:700}
.btn.sel{background:var(--pri);border-color:#8bb4ff}
.btn.go{background:var(--ok);border-color:#7ff0bd;color:#06281a;font-size:22px;padding:18px}
.btn.go:disabled{background:var(--card);color:var(--sub);border-color:var(--line)}
.btn.sm{font-size:15px;padding:10px;font-weight:600}
.btn.red{border-color:var(--bad);color:#ffb4b4}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}
.card .site{color:var(--sub);font-size:14px}
.card .main{font-size:28px;font-weight:800;margin:4px 0}
.card .small{color:var(--sub);font-size:14px}
.banner{border-radius:12px;padding:10px 12px;margin-top:10px;font-weight:700}
.banner.warn{background:#5a3b00;border:1px solid var(--warn)}
.banner.ok{background:#12503a;border:1px solid var(--ok)}
.types{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.types .btn:last-child:nth-child(odd){grid-column:1/3}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{background:#264057;border:1px solid var(--pri);border-radius:99px;padding:8px 12px;font-size:16px;font-weight:700}
.chip i{font-style:normal;color:var(--sub);font-weight:400;margin-left:6px;font-size:13px}
.thumb{width:100%;max-height:220px;object-fit:contain;border-radius:12px;margin-top:10px;background:#000}
.toast{position:fixed;left:12px;right:12px;bottom:16px;background:#0b1118;border:1px solid var(--line);border-radius:14px;padding:14px;font-size:17px;display:none;z-index:9}
.toast.on{display:block}
.toast.ok{border-color:var(--ok)}.toast.bad{border-color:var(--bad)}
input[type=text]{width:100%;font-size:20px;padding:14px;border-radius:12px;border:2px solid var(--line);background:#0f1822;color:var(--tx)}
.hint{color:var(--sub);font-size:14px;margin-top:8px}
.recent{margin-top:14px;font-size:14px;color:var(--sub)}
.recent div{padding:4px 0;border-bottom:1px solid #263544}
</style>
</head>
<body>

<!-- 처음 화면 -->
<section id="home" class="screen on">
  <div class="pad">
    <h1>파렛트 스캔</h1>
    <p class="hint">누가 쓰는 휴대폰인지 고르세요. 기록에 이 이름이 남습니다.</p>
    <button class="big pack" data-mode="포장">포장</button>
    <button class="big ship" data-mode="출고1" disabled>출고 1 <small>(준비 중)</small></button>
    <button class="big ship" data-mode="출고2" disabled>출고 2 <small>(준비 중)</small></button>
    <div id="homeNet" class="hint"></div>
  </div>
</section>

<!-- 포장 화면 -->
<section id="pack" class="screen">
  <div class="top">
    <button class="btn sm" id="backHome">◀</button>
    <div class="grow" id="modeName">포장</div>
    <span class="pill" id="queuePill" style="display:none"></span>
    <span class="pill" id="netPill">연결 확인 중</span>
  </div>
  <div class="cam">
    <video id="video" playsinline muted></video>
    <div class="aim"></div>
    <div class="msg" id="camMsg">QR을 네모 안에 맞춰 주세요</div>
  </div>
  <div class="pad" id="panel">
    <div id="idle">
      <div class="row">
        <button class="btn" id="btnMerge">합치기</button>
        <button class="btn" id="btnManual">번호 직접 입력</button>
      </div>
      <div class="recent" id="recent"></div>
    </div>

    <div id="manualBox" style="display:none">
      <input type="text" id="manualIn" inputmode="text" placeholder="번호만 (예: 586) 또는 PO|번호" autocomplete="off">
      <div class="hint" id="manualHint"></div>
      <div class="row"><button class="btn" id="manualCancel">취소</button><button class="btn go" id="manualOk">확인</button></div>
    </div>

    <div id="one" style="display:none">
      <div class="card">
        <div class="site" id="oSite"></div>
        <div class="main" id="oMain"></div>
        <div class="small" id="oSmall"></div>
      </div>
      <div id="oBanner"></div>
      <div class="types" id="oTypes"></div>
      <img id="oThumb" class="thumb" style="display:none" alt="">
      <div class="row">
        <button class="btn sm" id="oPhoto">📷 사진 (필수)</button>
        <button class="btn sm red" id="oUndo" style="display:none">포장 취소</button>
      </div>
      <div class="row stick">
        <button class="btn" id="oCancel">닫기</button>
        <button class="btn go" id="oSave" disabled>종류를 고르세요</button>
      </div>
    </div>

    <div id="mergeBox" style="display:none">
      <div class="card"><div class="main" style="font-size:22px">합치기</div>
        <div class="small">합칠 파렛트의 QR을 하나씩 연달아 찍으세요 (2개 이상)</div>
        <div class="chips" id="mChips"></div></div>
      <div class="types" id="mTypes"></div>
      <img id="mThumb" class="thumb" style="display:none" alt="">
      <div class="row"><button class="btn sm" id="mPhoto">📷 사진 (필수)</button><button class="btn sm red" id="mClear">비우기</button></div>
      <div class="row stick">
        <button class="btn" id="mCancel">닫기</button>
        <button class="btn go" id="mSave" disabled>합치기 저장</button>
      </div>
    </div>
  </div>
  <input type="file" id="file" accept="image/*" capture="environment" style="display:none">
</section>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>
"use strict";
const API = "https://script.google.com/macros/s/AKfycbzG5zBEqGenvl0y2aaXL1hvMPBDENRQwCbYi6Y4LwnFS9R8Jl22zl4NM5JfOw6m9t42/exec";
const TYPES = ["철","작은나무","큰나무","폭좁은나무","기타"];
const KEY_RE = /^\d{2}-\d{4}-\d{4}-\d{2}\|\d+$/;
const $ = id => document.getElementById(id);
const ls = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
};

let mode = ls.get("mode", "");
let stream = null, detector = null, scanning = false, busy = false;
let current = null;            // 지금 화면에 띄운 파렛트 {key, info, type, photo}
let merging = false, mergeKeys = [], mergeType = "", mergePhoto = "";
let lastSeen = {key:"", at:0};
let recent = ls.get("recent", []);
let queue = ls.get("queue", []);
let online = null;

// ---------------------------------------------------------------- 통신
async function api(body, timeoutMs){
  if (API.indexOf("__API") === 0) throw new Error("서버 주소가 아직 설정되지 않았습니다");
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), timeoutMs || 20000);
  try{
    const r = await fetch(API, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(body), signal:ctl.signal});
    const j = await r.json();
    if (!j.ok) throw Object.assign(new Error(j.error || "서버 오류"), {server:true});
    return j;
  } finally { clearTimeout(t); }
}

function setNet(ok){
  online = ok;
  const p = $("netPill");
  p.textContent = ok ? "연결됨" : "연결 안 됨";
  p.className = "pill" + (ok ? "" : " bad");
  $("homeNet").textContent = ok ? "" : "서버에 연결되지 않았습니다. 찍은 기록은 휴대폰에 저장해 두었다가 연결되면 자동으로 올립니다.";
}
async function ping(){
  try{ await api({action:"ping"}, 8000); setNet(true); return true; }catch(e){ setNet(false); return false; }
}

// ---------------------------------------------------------------- 보내기 대기열 (신호가 약해도 잃어버리지 않게)
function saveQueue(){
  if (!ls.set("queue", queue)){
    // 저장 공간이 모자라면 사진을 빼고라도 기록은 남긴다
    queue.forEach(q => { if (q.photo) q.photo = ""; });
    ls.set("queue", queue);
    toast("휴대폰 저장 공간이 부족해 사진은 빼고 기록만 저장했습니다", "bad");
  }
  drawQueue();
}
function drawQueue(){
  const p = $("queuePill");
  p.style.display = queue.length ? "" : "none";
  p.textContent = "보내는 중 " + queue.length;
  p.className = "pill warn";
}
let flushing = false;
async function flush(){
  if (flushing || !queue.length) return;
  flushing = true;
  try{
    while (queue.length){
      const item = queue[0];
      try{ await api(item, 30000); queue.shift(); saveQueue(); setNet(true); }
      catch(e){
        if (e.server){ queue.shift(); saveQueue(); toast("서버가 거절했습니다: " + e.message, "bad"); }  // 계속 실패할 건은 버린다(안내 후)
        else { setNet(false); break; }
      }
    }
  } finally { flushing = false; }
}
function enqueue(item){ queue.push(item); saveQueue(); flush(); }

// ---------------------------------------------------------------- 화면 전환
function show(id){ document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id)); }
function toast(msg, kind){
  const t = $("toast"); t.textContent = msg; t.className = "toast on " + (kind || "");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.className = "toast", 2600);
}
function beep(ok){
  try{
    const a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(), g = a.createGain();
    o.connect(g); g.connect(a.destination); o.frequency.value = ok ? 880 : 300; g.gain.value = .15;
    o.start(); setTimeout(() => { o.stop(); a.close(); }, ok ? 120 : 300);
  }catch(e){}
  if (navigator.vibrate) navigator.vibrate(ok ? 60 : [120,60,120]);
}

document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => {
  if (b.disabled) return;
  mode = b.dataset.mode; ls.set("mode", mode); openPack();
});
$("backHome").onclick = () => { stopCam(); closeAll(); show("home"); };

async function openPack(){
  $("modeName").textContent = mode;
  show("pack"); drawQueue(); drawRecent(); closeAll();
  ping(); flush();
  await startCam();
}

// ---------------------------------------------------------------- 카메라 / QR 읽기
async function startCam(){
  $("camMsg").textContent = "카메라를 켜는 중...";
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}, width:{ideal:1280}, height:{ideal:1280}}, audio:false});
    const v = $("video"); v.srcObject = stream; await v.play();
    if ("BarcodeDetector" in window){ try{ detector = new BarcodeDetector({formats:["qr_code"]}); }catch(e){ detector = null; } }
    scanning = true; $("camMsg").textContent = "QR을 네모 안에 맞춰 주세요";
    loop();
  }catch(e){
    scanning = false;
    $("camMsg").textContent = "카메라를 쓸 수 없습니다. 아래 '번호 직접 입력'을 쓰세요 (" + (e.name || "오류") + ")";
  }
}
function stopCam(){
  scanning = false;
  if (stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
}
const cv = document.createElement("canvas"), cx = cv.getContext("2d", {willReadFrequently:true});
async function loop(){
  if (!scanning) return;
  const v = $("video");
  if (!busy && v.readyState >= 2 && v.videoWidth){
    try{
      let text = "";
      if (detector){
        const r = await detector.detect(v); if (r.length) text = r[0].rawValue;
      } else if (window.jsQR){
        const w = Math.min(v.videoWidth, 900), h = Math.round(v.videoHeight * w / v.videoWidth);
        cv.width = w; cv.height = h; cx.drawImage(v, 0, 0, w, h);
        const r = jsQR(cx.getImageData(0, 0, w, h).data, w, h, {inversionAttempts:"dontInvert"}); if (r) text = r.data;
      }
      if (text) onCode(text);
    }catch(e){}
  }
  setTimeout(loop, 120);
}

// ---------------------------------------------------------------- 코드가 읽혔을 때
function onCode(text){
  text = String(text).trim();
  const now = Date.now();
  if (text === lastSeen.key && now - lastSeen.at < 3500){ lastSeen.at = now; return; }
  lastSeen = {key:text, at:now};
  if (!KEY_RE.test(text)){ beep(false); toast("파렛트 QR이 아닙니다: " + text.slice(0, 40), "bad"); return; }
  if (merging) return addMerge(text);
  if (current) return;                      // 이미 카드가 떠 있으면 무시
  openOne(text);
}

function closeAll(){
  current = null; merging = false; mergeKeys = []; mergeType = ""; mergePhoto = "";
  ["one","mergeBox","manualBox"].forEach(i => $(i).style.display = "none");
  $("idle").style.display = ""; busy = false; lastSeen.at = Date.now(); document.body.classList.remove("working");
}
function typeButtons(boxId, getSel, setSel){
  const box = $(boxId); box.innerHTML = "";
  TYPES.forEach(t => {
    const b = document.createElement("button");
    b.className = "btn" + (getSel() === t ? " sel" : ""); b.textContent = t;
    b.onclick = () => { setSel(t); typeButtons(boxId, getSel, setSel); };
    box.appendChild(b);
  });
}

// ---------------------------------------------------------------- 한 개 포장완료
async function openOne(key){
  busy = true; beep(true); ls.set("lastPO", key.split("|")[0]);
  current = {key, info:null, type:"", photo:""}; document.body.classList.add("working");
  $("idle").style.display = "none"; $("manualBox").style.display = "none"; $("one").style.display = "";
  const num = key.split("|")[1], po = key.split("|")[0];
  $("oSite").textContent = po; $("oMain").textContent = "불러오는 중..."; $("oSmall").textContent = "파렛트 " + num;
  $("oBanner").innerHTML = ""; $("oThumb").style.display = "none"; $("oUndo").style.display = "none";
  updateOne();
  typeButtons("oTypes", () => current && current.type, t => { current.type = t; updateOne(); });
  try{
    const r = await api({action:"info", key}, 10000); setNet(true);
    if (!current || current.key !== key) return;
    current.info = r;
    const g = r.등록;
    $("oSite").textContent = (g ? g.현장 + "  ·  " : "") + po;
    $("oMain").textContent = g ? `${g.타입}  ${g.동}동  ${g.구분 === "구분없음" ? "" : g.구분 + "차분  "}${g.k} / ${g.N}` : "등록 정보 없음";
    $("oSmall").textContent = "파렛트 " + num + (g ? "" : " (목록에 없는 번호입니다. 그래도 기록할 수 있습니다)");
    const s = r.상태;
    if (s && s.상태 === "포장완료"){
      $("oBanner").innerHTML = `<div class="banner warn">이미 포장완료 · ${s.종류} · ${String(s.포장시각).slice(5,16)}${s.합침 ? " · 합침 " + s.합침 : ""}<br>다시 저장하면 새로 기록됩니다</div>`;
      if (!s.합침) $("oUndo").style.display = "";
      current.type = s.종류; typeButtons("oTypes", () => current.type, t => { current.type = t; updateOne(); }); updateOne();
    } else if (s && s.상태 && s.상태 !== "대기"){
      $("oBanner").innerHTML = `<div class="banner warn">현재 상태: ${s.상태}</div>`;
    }
  }catch(e){
    setNet(false); $("oMain").textContent = "(연결 안 됨) 정보를 못 불러왔지만 기록은 할 수 있습니다";
  }
}
$("oCancel").onclick = () => closeAll();
$("oPhoto").onclick = () => { pickFor = "one"; $("file").click(); };
function updateOne(){
  const ok = !!(current && current.type && current.photo);
  const b = $("oSave"); b.disabled = !ok;
  b.textContent = !current ? "포장완료 저장" : !current.type ? "종류를 고르세요" : !current.photo ? "사진을 찍어야 저장됩니다" : "포장완료 저장";
}
$("oSave").onclick = () => {
  if (!current || !current.type || !current.photo) return;
  const c = current;
  enqueue({action:"pack", key:c.key, type:c.type, photo:c.photo, user:mode, at:Date.now()});
  addRecent(`${c.key.split("|")[1]}번 · ${c.type}`); beep(true);
  toast(`${c.key.split("|")[1]}번 포장완료 (${c.type})`, "ok");
  closeAll();
};
$("oUndo").onclick = async () => {
  if (!current) return;
  if (!confirm("이 파렛트의 포장완료를 취소할까요?")) return;
  try{ await api({action:"undo", key:current.key, user:mode}, 15000); addRecent(current.key.split("|")[1] + "번 · 취소"); toast("취소했습니다", "ok"); closeAll(); }
  catch(e){ toast(e.message, "bad"); }
};

// ---------------------------------------------------------------- 합치기
$("btnMerge").onclick = () => {
  merging = true; mergeKeys = []; mergeType = ""; mergePhoto = "";
  $("idle").style.display = "none"; $("mergeBox").style.display = ""; document.body.classList.add("working");
  $("mThumb").style.display = "none"; drawMerge();
};
async function addMerge(key){
  if (mergeKeys.some(m => m.key === key)){ toast("이미 찍은 파렛트입니다", "bad"); beep(false); return; }
  const po = key.split("|")[0];
  if (mergeKeys.length && mergeKeys[0].key.split("|")[0] !== po){ toast("PO가 다른 파렛트는 합칠 수 없습니다", "bad"); beep(false); return; }
  beep(true);
  const item = {key, label:""};
  mergeKeys.push(item); drawMerge();
  try{ const r = await api({action:"info", key}, 8000); const g = r.등록; item.label = g ? `${g.타입} ${g.동}동` : ""; drawMerge(); }catch(e){}
}
function drawMerge(){
  const box = $("mChips"); box.innerHTML = "";
  mergeKeys.forEach(m => {
    const d = document.createElement("div"); d.className = "chip";
    d.innerHTML = `${m.key.split("|")[1]}<i>${m.label || ""}</i> ✕`;
    d.onclick = () => { mergeKeys = mergeKeys.filter(x => x !== m); drawMerge(); };
    box.appendChild(d);
  });
  typeButtons("mTypes", () => mergeType, t => { mergeType = t; drawMerge(); });
  $("mSave").disabled = !(mergeKeys.length >= 2 && mergeType && mergePhoto);
  const lbl = mergeKeys.map(m => m.key.split("|")[1]).sort((a,b)=>a-b).join("+");
  $("mSave").textContent = mergeKeys.length < 2 ? "2개 이상 찍으세요" : !mergeType ? "종류를 고르세요" : !mergePhoto ? "사진을 찍어야 저장됩니다" : `${lbl} 합치기 저장`;
}
$("mClear").onclick = () => { mergeKeys = []; drawMerge(); };
$("mCancel").onclick = () => closeAll();
$("mPhoto").onclick = () => { pickFor = "merge"; $("file").click(); };
$("mSave").onclick = () => {
  if (mergeKeys.length < 2 || !mergeType || !mergePhoto) return;
  const nums = mergeKeys.map(m => m.key.split("|")[1]).sort((a,b) => a - b).join("+");
  enqueue({action:"merge", keys:mergeKeys.map(m => m.key), type:mergeType, photo:mergePhoto, user:mode, at:Date.now()});
  addRecent(`합침 ${nums} · ${mergeType}`); beep(true); toast(`${nums} 합쳐서 저장`, "ok"); closeAll();
};

// ---------------------------------------------------------------- 사진 (찍은 뒤 미리보기 → 저장 때 같이 보냄)
let pickFor = "one";
$("file").onchange = async ev => {
  const f = ev.target.files && ev.target.files[0]; ev.target.value = "";
  if (!f) return;
  try{
    const url = await shrink(f, 1280, .7);
    if (pickFor === "merge"){ mergePhoto = url; $("mThumb").src = url; $("mThumb").style.display = ""; drawMerge(); }
    else if (current){ current.photo = url; $("oThumb").src = url; $("oThumb").style.display = ""; updateOne(); }
  }catch(e){ toast("사진을 읽지 못했습니다", "bad"); }
};
function shrink(file, max, q){
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
      res(c.toDataURL("image/jpeg", q));
    };
    img.onerror = rej; img.src = u;
  });
}

// ---------------------------------------------------------------- 번호 직접 입력 (멀리서 안 찍힐 때)
$("btnManual").onclick = () => {
  $("idle").style.display = "none"; $("manualBox").style.display = "";
  const po = lastPO(); $("manualHint").textContent = po ? "번호만 넣으면 마지막으로 쓴 PO(" + po + ")로 인식합니다" : "PO|번호 형태로 입력하세요 (예: 26-2602-0010-01|586)";
  $("manualIn").value = ""; setTimeout(() => $("manualIn").focus(), 50);
};
$("manualCancel").onclick = () => closeAll();
$("manualOk").onclick = () => {
  let v = $("manualIn").value.trim();
  if (/^\d+$/.test(v)){ const po = lastPO(); if (!po){ toast("PO를 알 수 없어 PO|번호로 입력해 주세요", "bad"); return; } v = po + "|" + v; }
  if (!KEY_RE.test(v)){ toast("형식이 맞지 않습니다", "bad"); return; }
  $("manualBox").style.display = "none"; lastSeen = {key:v, at:Date.now()};
  if (merging) addMerge(v); else openOne(v);
};
function lastPO(){ return ls.get("lastPO", ""); }

// ---------------------------------------------------------------- 최근 기록
function addRecent(t){ recent.unshift(new Date().toTimeString().slice(0,5) + "  " + t); recent = recent.slice(0, 6); ls.set("recent", recent); drawRecent(); }
function drawRecent(){ $("recent").innerHTML = recent.length ? "<b>방금 한 것</b>" + recent.map(r => "<div>" + r + "</div>").join("") : ""; }

setInterval(flush, 8000);
window.addEventListener("online", () => { ping(); flush(); });
drawQueue();
if (mode) $("modeName").textContent = mode;
ping();
</script>
