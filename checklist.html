<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>선출고 체크리스트</title>
<style>
:root{--s:.5;--f:1;--navy:#1f3a5f;--line:#c9d1db;--yellow:#ffe94d;--orange:#ffd8a8;--green:#b9f0c4;--blue:#cfe3ff;--ink:#14213d;--mute:#7a8699}
*{box-sizing:border-box}
body{margin:0;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:var(--ink);background:#eef1f5}
body.home{display:block;overflow:auto}
header{flex:none;z-index:30;background:var(--navy);color:#fff;padding:8px 14px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
header h1{font-size:max(calc(18px*var(--s)),15px);margin:0}
header .sub{font-size:max(calc(13px*var(--s)),11px);opacity:.9}
.chips{display:flex;gap:8px;align-items:center;margin-left:auto;flex-wrap:wrap}
.net{font-size:11px;padding:2px 8px;border-radius:10px;background:#2f9e44;color:#fff;font-weight:700}
.net.bad{background:#c0392b}
.hb{font-size:15px;padding:5px 12px;border:0;border-radius:6px;background:#fff;color:var(--navy);font-weight:800;cursor:pointer}
.hb.on{background:var(--yellow)}
.hb.both{background:#222;color:#ffe94d;display:none}
.hb.both.on{background:#111;color:#ffe94d;box-shadow:0 0 0 3px #fff}
#bothbar{display:none;flex:none;background:#111;color:#ffe94d;font-weight:900;text-align:center;padding:7px 8px;font-size:max(calc(17px*var(--s)),15px)}
body.both header{background:#e0a800}
body.both #modes{background:#8a6500}
body.both #bothbar{display:block}
body.both .wrap{background:#fff6cc;box-shadow:inset 0 0 0 5px #e0a800}
body.both #modal .box{box-shadow:0 0 0 6px #e0a800}
.bnote{background:#fff3b0;border:2px solid #e0a800;border-radius:8px;padding:8px;margin:8px 0;font-weight:800;color:#6b4a00}
#modes{flex:none;display:flex;gap:6px;background:#0f2540;padding:6px 8px}
#modes button{flex:1;border:0;border-radius:8px;padding:7px 4px;background:#dfe7f2;color:var(--navy);font-weight:900;font-size:16px;line-height:1.25;cursor:pointer}
#modes button small{display:block;font-weight:700;font-size:11px;color:#44546a}
#modes button.on{background:var(--yellow)}
#tools{flex:none;z-index:25;background:#16304f;padding:6px 8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#tools button{font-size:15px;font-weight:800;padding:2px 12px;border:0;border-radius:14px;background:#dfe7f2;color:var(--navy);cursor:pointer}
#tools button.on{background:var(--yellow)}
#tools button.ok{background:#8fe3a1}
#tools .tg{background:#fff;border:2px solid var(--yellow)}
#tools .tg.on{background:var(--yellow)}
.wrap{overflow:auto;flex:1;min-height:0;background:#fff}
body.selmode .wrap{padding-bottom:170px}
/* 작업/포장 목록 */
.list{padding:6px 8px}
.wr,.pr{display:flex;gap:10px;align-items:stretch;border:1px solid var(--line);border-radius:10px;margin:0 0 6px;background:#fff;cursor:pointer;font-size:calc(15px*var(--f))}
.wr .wn{flex:none;width:calc(54px*var(--f));display:flex;align-items:center;justify-content:center;font-weight:900;font-size:calc(20px*var(--f));color:var(--navy);background:#f1f4f9;border-radius:10px 0 0 10px}
.wr .wm,.pr .pm{flex:1;min-width:0;padding:6px 0}
.wedge{font-weight:900;font-size:calc(24px*var(--f));line-height:1.15;color:var(--navy);letter-spacing:.3px}
.wm{padding-left:12px!important}
.wname{font-weight:900;font-size:calc(17px*var(--f));line-height:1.3}
.wcode{color:#44546a;font-size:calc(13px*var(--f))}
.wproc{display:inline-block;margin-top:2px;background:#e8edf4;color:var(--navy);font-weight:800;border-radius:6px;padding:0 6px;font-size:calc(12px*var(--f))}
.wnote{color:var(--mute);font-size:calc(11px*var(--f));line-height:1.3}
.wq{flex:none;width:calc(86px*var(--f));display:flex;flex-direction:column;align-items:center;justify-content:center;border-left:1px solid var(--line);border-radius:0 10px 10px 0}
.wbig{font-weight:900;font-size:calc(28px*var(--f));line-height:1.1}
.wsub{font-size:calc(11px*var(--f));color:#6b5b3a;font-weight:700}
.wr.part .wq{background:var(--orange)}.wr.part .wbig{color:#a24400}
.wr.done .wq{background:var(--yellow)}.wr.done .wbig{color:#2e6b00}
.wr.done{opacity:.85}
.sel{outline:4px solid #1c7ed6;outline-offset:-4px}
.pr .pb{flex:none;width:calc(76px*var(--f));display:flex;align-items:center;justify-content:center;font-weight:900;font-size:calc(24px*var(--f));border-radius:10px 0 0 10px;background:#eceff4;color:#6b7686}
.pr.ready .pb{background:var(--blue);color:var(--navy)}
.pr.part .pb{background:var(--orange);color:#a24400}
.pr.done .pb{background:var(--green);color:#1d6b2f}
.pr .pm .ln{font-weight:800;font-size:calc(15px*var(--f));line-height:1.35}
.pr .pm .ln .le{color:var(--navy);font-size:calc(17px*var(--f))}
.pr .pm .ln .sh{font-style:normal;color:#b3261e;background:#ffe1de;border-radius:6px;padding:0 6px;font-size:calc(12px*var(--f));font-weight:900;white-space:nowrap}
.adm{background:#b3261e;color:#fff;border-radius:6px;padding:2px 8px;font-weight:900;font-size:13px}
.pin{display:flex;gap:6px;margin:6px 0}.pin input{flex:1;font-size:18px;padding:8px;border:2px solid #b3261e;border-radius:8px}
.btn.adm2{background:#b3261e;color:#fff}
.pr .pm .ln span{color:#44546a;font-weight:600;font-size:calc(12px*var(--f))}
.pr .pm .ln.ok::before{content:"✔ ";color:#2f9e44}
.pr .pm .ln.no::before{content:"⏳ ";}
.pr .pmeta{color:var(--mute);font-size:calc(12px*var(--f))}
.pr .ps{flex:none;width:calc(104px*var(--f));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-left:1px solid var(--line);padding:4px}
.st{font-weight:900;border-radius:12px;padding:1px 9px;font-size:calc(13px*var(--f))}
.st.wait{background:#e5e8ee;color:#6b7686}.st.ready{background:var(--blue);color:var(--navy)}.st.part{background:var(--orange);color:#a24400}.st.done{background:#8fe3a1;color:#14532d}
.pcnt{font-weight:800;font-size:calc(14px*var(--f))}
.psm{font-size:calc(11px*var(--f));color:var(--mute)}
h3.grp{margin:8px 0 6px;padding:8px 10px;background:#0f2540;color:#fff;font-size:calc(17px*var(--f));border-radius:8px;position:sticky;top:0;z-index:5}
h3.grp.ok{background:#1e7a3c}
.empty{padding:30px;text-align:center;color:var(--mute)}
/* 동별 표 */
.tabs{display:none}
h2.tt{margin:0;padding:10px 12px;background:#0f2540;color:#fff;font-size:max(calc(22px*var(--s)),16px);position:sticky;left:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h2.tt .ban{font-size:max(calc(15px*var(--s)),12px);background:#2f9e44;color:#fff;border-radius:12px;padding:0 10px}
h2.tt .ban.no{background:#44546a}
table{margin-bottom:26px;border-collapse:separate;border-spacing:0;font-size:calc(14px*var(--s))}
th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center;padding:0}
thead th{position:sticky;background:#dfe7f2;z-index:5;padding:3px 6px;font-weight:800;font-size:max(calc(21px*var(--s)),15px);height:max(calc(36px*var(--s)),28px)}
thead tr:nth-child(1) th{top:0}
thead tr:nth-child(2) th{top:max(calc(36px*var(--s)),28px)}
th.cha3{background:#cfe3ff}th.cha4{background:#d7f0d2}
.c1{position:sticky;left:0;background:#f6f8fb;z-index:4;min-width:calc(110px*var(--s));font-weight:900;font-size:calc(30px*var(--s));border-right:2px solid #8c98a9;color:var(--navy)}
.c1.rdy{background:#cfe3ff}.c1.prt{background:#ffd8a8}.c1.dn{background:#8fe3a1;color:#14532d}
thead .c1{z-index:8;font-size:max(calc(18px*var(--s)),14px);background:#f6f8fb}
td.cell{position:relative;min-width:calc(78px*var(--s));height:calc(50px*var(--s));cursor:pointer;user-select:none}
td.cell .main{font-size:calc(22px*var(--s));font-weight:800;line-height:calc(50px*var(--s))}
td.cell .orig{position:absolute;left:4px;top:2px;font-size:calc(11px*var(--s));color:#6b5b3a;font-weight:700}
td.cell.part{background:var(--orange)}td.cell.part .main{color:#a24400}
td.cell.done{background:var(--yellow)}td.cell.done .main{color:#2e6b00}
td.cell.lock{background:#e4e7ec;cursor:not-allowed}td.cell.lock .main{color:#a3acb9;font-weight:500}td.cell.lock::after{content:'🔒';position:absolute;right:3px;top:1px;font-size:calc(11px*var(--s))}
td.cell.zero{background:#f3f4f6;color:#b6bcc6;cursor:default}td.cell.zero .main{font-weight:400;font-size:calc(16px*var(--s))}
td.cell.sel{outline:4px solid #1c7ed6;outline-offset:-4px;background:#d0ebff!important}
tr.boxstart td{border-top:2px solid #8c98a9}
/* 손잡이도어 작업카드 */
.wr.nc .wn2{flex:none;width:calc(78px*var(--f));display:flex;flex-direction:column;align-items:center;justify-content:center;background:#17345c;color:#fff;border-radius:10px 0 0 10px;line-height:1.1}
.wr.nc .wn2 small{font-size:calc(11px*var(--f));opacity:.8;font-weight:700}.wr.nc .wn2 b{font-size:calc(22px*var(--f));font-weight:900}
.wr.nc.done .wn2{background:#2f7d44}
.nc .sd{display:inline-block;border-radius:7px;padding:0 9px;font-weight:900;font-size:calc(20px*var(--f));margin-right:8px;color:#fff}
.nc .sd.s1{background:#1c7ed6}.nc .sd.s2{background:#e8590c}.nc .sd.s3{background:#6b7686}
.nc .sp{display:flex;align-items:baseline;gap:8px;margin-top:2px}
.nc .sp i{font-style:normal;font-size:calc(11px*var(--f));font-weight:800;border-radius:5px;padding:0 6px;white-space:nowrap}
.nc .sp i.k1{background:#e5e8ee;color:#44546a}.nc .sp i.k2{background:#d3f3da;color:#1d6b2f}
.nc .sp b{font-size:calc(22px*var(--f));font-weight:900;color:var(--navy)}
.nc .pcs{color:#44546a;font-weight:700;font-size:calc(12px*var(--f));margin-top:2px}
.pr .pm .ln .wp{font-style:normal;border-radius:6px;padding:0 6px;font-size:calc(12px*var(--f));font-weight:900;white-space:nowrap;margin-left:4px;background:#e5e8ee;color:#6b7686}
.pr .pm .ln .wp.part{background:var(--orange);color:#a24400}.pr .pm .ln .wp.done{background:#d3f3da;color:#1d6b2f}
tr.blkrow td{background:#17345c;color:#fff;font-weight:800;text-align:left;padding:4px 10px;font-size:calc(15px*var(--s));position:sticky;left:0}
/* 모달/바 */
#modal{position:fixed;inset:0;background:rgba(10,20,40,.55);display:none;align-items:center;justify-content:center;z-index:50}
#modal .box{background:#fff;border-radius:14px;padding:18px 20px;width:min(460px,94vw);max-height:92vh;overflow:auto;box-shadow:0 8px 30px rgba(0,0,0,.35)}
#modal h2{margin:0 0 4px;font-size:19px}
#modal .info{color:#44546a;margin-bottom:10px;font-size:14px;line-height:1.5}
#modal .big{font-size:15px;margin:6px 0 12px}
.btn{display:block;width:100%;padding:13px;font-size:18px;font-weight:800;border:0;border-radius:10px;margin-bottom:9px;cursor:pointer;font-family:inherit}
.btn.ok{background:#2f9e44;color:#fff}.btn.sec{background:#e8edf4;color:var(--navy)}.btn.warn{background:#fff0f0;color:#b02a2a}
.btn:disabled{opacity:.35;cursor:default}
.row{display:flex;gap:8px;margin-bottom:9px}
.row input{flex:1;min-width:0;font-size:22px;padding:9px;border:2px solid #aab6c8;border-radius:10px;text-align:center}
.row .btn{width:130px;margin:0}
.msg{color:#b02a2a;font-weight:700;min-height:20px;font-size:14px}
.lbl{font-size:13px;color:#5b6b82;margin:8px 0 3px}
.notice{background:#fff7e0;border:1px solid #f0c36d;border-radius:8px;padding:6px 10px;margin:6px 0;font-size:14px;font-weight:700}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:none;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#0f2540;align-items:center;flex-wrap:wrap;box-shadow:0 -4px 14px rgba(0,0,0,.35)}
#bar .btn{width:auto;flex:1;margin:0;min-width:140px;padding:11px;font-size:17px}
#bar .bm{color:#ffd8a8;font-size:14px;flex-basis:100%;font-weight:700}
#toast{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#14213d;color:#fff;padding:10px 16px;border-radius:10px;z-index:80;font-weight:700;display:none;max-width:92vw;box-shadow:0 4px 16px rgba(0,0,0,.4)}
/* 홈 */
#home{max-width:720px;margin:0 auto;padding:16px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
#home h1{font-size:24px;margin:6px 0 4px;color:var(--navy)}
#home .hint{color:var(--mute);font-size:14px;margin-bottom:14px}
.card{display:block;width:100%;text-align:left;background:#fff;border:2px solid #c9d1db;border-radius:14px;padding:14px 16px;margin-bottom:12px;cursor:pointer;font-family:inherit}
.card:active{background:#eef4ff}
.card .po{font-size:15px;color:#5b6b82;font-weight:700}
.card .nm{font-size:22px;font-weight:900;color:var(--navy);margin:2px 0 8px}
.bar{height:10px;background:#e5e9f0;border-radius:6px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:#2f9e44}
.card .st2{font-size:13px;color:#44546a;margin-top:6px}
.foot{margin-top:auto;padding:28px 0 calc(14px + env(safe-area-inset-bottom));text-align:center;color:var(--mute);font-size:12px;line-height:1.75}
.foot .ttl{font-size:20px;font-weight:800;color:var(--ink)}.foot .ttl span{color:#c0392b}
.foot .ver{opacity:.8}.foot a{color:var(--mute);text-decoration:none}
@media (max-width:700px){header{padding:5px 8px}header h1{font-size:15px}}
</style></head><body class="home">
<div id="home"></div>
<header id="hd" style="display:none">
 <button class="hb" onclick="goHome()">◀ 현장 목록</button>
 <h1 id="ht"></h1><span class="adm" id="admb" style="display:none">관리자</span><div class="sub" id="s"></div>
 <div class="chips"><span class="sub" id="prog"></span><span class="net" id="net">연결됨</span>
 <button class="hb" id="selbtn" onclick="toggleSel()">여러 칸 선택</button>
 <button class="hb both" id="bothbtn" onclick="toggleBoth()">포장+동별</button>
 <button class="hb" onclick="zoom(-.1)">글씨 −</button><button class="hb" onclick="zoom(.1)">글씨 +</button></div>
</header>
<div id="modes" style="display:none"></div>
<div id="bothbar">⚡ 포장+동별 동시 진행 중 — 지금 누르는 칸은 포장 수량에도 같이 들어갑니다 (끝나면 위 버튼을 꺼 주세요)</div>
<div id="tools" style="display:none"></div>
<div class="wrap" id="wrap" style="display:none"></div>
<div id="bar"></div>
<div id="toast"></div>
<div id="modal"><div class="box" id="mb"></div></div>
<script>
let API='https://script.google.com/macros/s/AKfycbwehhEsRDOCmftOCrgg1Wn5rnJLZPfqE9jg8U3gpnAowb8rMPoWwPs5eNj4QnV58CsI3A/exec';
if(API.indexOf('__API')===0){API='';try{const q=new URLSearchParams(location.search).get('api');if(q)localStorage.setItem('apiMain',q);API=localStorage.getItem('apiMain')||'';}catch(e){}}
const APP_VER='1.7',APP_DATE='2026.11.24';
const $=id=>document.getElementById(id);
const bs0=b=>String(b==null?'':b).split('~')[0];   // 동별 두 번째 줄('#A3~2')도 포장 박스 '#A3' 로 연결
const lab=(b,p)=>{b=String(b==null?'':b);p=String(p==null?'':p);b=p&&b.indexOf(p+' ')===0?b.slice(p.length+1):b;return b.replace(/~\d+$/,'');};   // '59A A-1' → 'A-1'
const labP=lab;
const isNo=w=>/^No\./.test(w.model||'');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function get(q){const r=await fetch(API+'?'+q);return r.json();}
async function post(o){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(o)});return r.json();}
function netOk(ok){const n=$('net');n.textContent=ok?'연결됨':'연결 끊김 - 다시 시도 중';n.className='net'+(ok?'':' bad');}
function toast(t,ms){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',ms||4500);}

let SITE=null,PO=null,mode='work',timer=null,busy=false,cur=null;
let wD=[],pD=[],dD=[],wIdx={},pIdx={},boxDong={};
let both=false,selMode=false,sel=new Set(),lastBatch=null,bmsg='';
let wCat='전체',wLeft=false,pType='전체',pReady=false,dTypeJump=0;

// ---------- 홈 ----------
function saveApi(){const v=($('apiin').value||'').trim();if(!v.startsWith('http')){alert('https://script.google.com/... 로 시작하는 주소를 붙여 넣어 주세요');return;}try{localStorage.setItem('apiMain',v);}catch(e){}API=v;showHome();}
async function showHome(){
 clearInterval(timer);PO=null;SITE=null;
 if(!API){document.body.className='home';['hd','modes','tools','wrap'].forEach(i=>$(i).style.display='none');$('home').style.display='flex';
  $('home').innerHTML='<h1>선출고 체크리스트</h1><div class="hint">처음 한 번만: 서버(구글 앱스 스크립트) 웹 앱 주소를 붙여 넣고 저장하세요.</div><input id="apiin" style="width:100%;font-size:15px;padding:10px;border:2px solid #aab6c8;border-radius:10px" placeholder="https://script.google.com/macros/s/.../exec"><button class="btn ok" style="margin-top:10px" onclick="saveApi()">저장</button>';return;}
 document.body.className='home';['hd','modes','tools','wrap'].forEach(i=>$(i).style.display='none');$('home').style.display='flex';
 $('home').innerHTML='<h1>선출고 체크리스트</h1><div class="hint">작업할 현장(PO)을 눌러 주세요</div><div id="list">불러오는 중…</div>'+
 `<div class="foot"><div class="ttl">선출고 체크리스트</div><div class="ver">화면 버전 ${APP_VER} · ${APP_DATE} · <span id="sver">서버 확인 중…</span></div>
 <div class="sp">작업 · 포장 · 동별 연동</div><div>개발 : 서동원 &nbsp;·&nbsp; Claude(Anthropic) 활용 개발</div>
 <div>문의 : <a href="tel:01087710442">010-8771-0442</a></div><div>© 2026 서동원. All rights reserved.</div><div class="ver">무단 복제·배포를 금합니다.</div></div>`;
 const bar=(a,t)=>`<div class="bar"><i style="width:${t?a/t*100:0}%"></i></div>`;
 const load=async()=>{try{const r=await get('action=sites');if(!r.ok)throw 0;if($('sver'))$('sver').textContent='서버 '+(r.ver||'1.2 이하 (Code.gs 새 버전 배포 필요)');
  if(!r.sites.length){$('list').innerHTML='<div class="hint">등록된 현장이 없습니다.</div>';return;}
  $('list').innerHTML=r.sites.map(s=>{const k=s.stat;return `<button class="card" onclick="openSite('${esc(s.po)}')"><div class="po">PO ${esc(s.po)}${s.kind?` <span style="background:#e8edf4;color:#17345c;border-radius:6px;padding:1px 8px;margin-left:6px;font-size:13px;font-weight:800">${esc(s.kind)}</span>`:''}</div><div class="nm">${esc(s.site)}</div>
   <div class="st2">작업 ${k.work.f}/${k.work.t}줄 ${bar(k.work.f,k.work.t)}</div>
   <div class="st2">포장 ${k.pack.f}/${k.pack.t}박스 ${bar(k.pack.f,k.pack.t)}</div>
   <div class="st2">동별 ${k.dong.f}/${k.dong.t}칸 ${bar(k.dong.f,k.dong.t)}</div></button>`;}).join('');

const wDone=i=>wD[i]>=SITE.work[i].q;
const ADMIN=/[?&]admin(=|&|#|$)/.test(location.search+location.hash);
let OVR=new Set();
const allow=q=>Math.floor(q*((SITE&&SITE.short)||12)/100);          // 총수량 q 에서 모자라도 되는 개수 (12%)
const wOK=i=>wD[i]>=SITE.work[i].q-allow(SITE.work[i].q);           // 작업이 '포장 가능' 수준까지 됐는가
const lineOK=l=>!l.work||(l.work in wIdx&&wOK(wIdx[l.work]));
const lineShort=l=>{if(!l.work||!(l.work in wIdx))return 0;const i=wIdx[l.work];return Math.max(0,SITE.work[i].q-wD[i]);};
function packable(bi){const b=SITE.pack[bi];return OVR.has(b.box)||b.lines.every(lineOK);}
function shortOf(bi){return SITE.pack[bi].lines.reduce((m,l)=>Math.max(m,lineShort(l)),0);}
function Lof(bi){let s=0;(boxDong[SITE.pack[bi].box]||[]).forEach(([ti,ri])=>dD[ti][ri].forEach(v=>s+=v));return s;}
function Eof(bi){return pD[bi];}
function capOf(bi){   // 가공한 수량 기준으로 지금 더 포장할 수 있는 박스 수 (가공 연결이 없는 현장은 null = 제한 없음)
 const b=SITE.pack[bi];let cap=null;
 b.lines.forEach(l=>(l.wks||[]).forEach(id=>{if(!(id in wIdx))return;
  let packed=0;SITE.pack.forEach((bb,j)=>bb.lines.forEach(ll=>{if((ll.wks||[]).indexOf(id)>=0)packed+=pD[j]*(ll.per||1);}));
  const free=Math.floor((wD[wIdx[id]]-packed)/(l.per||1));cap=cap===null?free:Math.min(cap,free);}));
 return cap===null?null:Math.max(0,cap);}

// ---------- 모달 (작업/포장/동별 공통) ----------
function ctxOf(c){
 if(c.k==='w'&&isNo(c.w=SITE.work[c.i])){const w=c.w;return {title:`작업 · 규격 ${esc(w.model)} · ${esc(w.name)}`,head:esc(w.model+' '+w.name),sub:`재단(가공 전) <b>${esc(w.edge)}</b><br>마감(가공 후) <b>${esc(w.vcut)}</b><br>${esc(w.proc)}${w.note?'<br>'+esc(w.note):''}`,q:w.q,d:wD[c.i],unit:'장',what:'가공한',body:{type:'작업',box:w.id,ci:0},extra:'',blocked:false,tail:'여기서 입력한 수량은 포장 화면의 해당 박스에 "가공 ○/○"로 자동 표시됩니다.'};}
 if(c.k==='w'){const w=SITE.work[c.i];return {title:'작업',head:esc(w.edge||w.model),sub:`${esc(w.name)}${w.vcut?'<br>V컷 '+esc(w.vcut):''}`,q:w.q,d:wD[c.i],unit:'개',what:'만든',body:{type:'작업',box:w.id,ci:0},
   extra:'',blocked:false,tail:w.codes?'작업이 모두 끝나면 이 부재가 들어가는 포장 박스가 "포장 가능"으로 바뀝니다.':'이 품목은 포장리스트와 연결되지 않습니다 (작업 체크만).'};}
 if(c.k==='p'){const b=SITE.pack[c.i],can=packable(c.i);return {title:`포장 · ${esc(b.pyeong)} 박스 ${esc(labP(b.box,b.pyeong))}`,head:esc(labP(b.box,b.pyeong)),sub:b.lines.map(l=>'<b>'+esc(l.edge||l.model)+'</b> '+esc(l.name)+(l.vcut?' · V컷 '+esc(l.vcut):'')+wprog(l)).join('<br>'),q:b.n,d:Eof(c.i),unit:'박스',what:'포장한',body:{type:'포장',box:b.box,ci:0},
   extra:packExtra(c.i,can),blocked:!can,noAll:(()=>{const k=capOf(c.i);return k!==null&&k<b.n-Eof(c.i);})(),tail:''};}
 const T=SITE.dong[c.ti],r=T.rows[c.ri],cl=T.cols[c.ci];const bs=boxStat(r.box);
 return {title:`${esc(T.name)} · ${esc(cl.dong)}${cl.cha?' · '+esc(cl.cha):''}`,head:esc(lab(r.box,T.name)),sub:'',q:r.q[c.ci],d:dD[c.ti][c.ri][c.ci],unit:'개',what:'올린',body:{type:T.name,box:r.box,ci:c.ci},
  both:true,
  extra:(both?'<div class="bnote">⚡ 포장+동별 모드: 올린 만큼 포장 수량에도 같이 들어갑니다.</div>':'')+(()=>{const f=dongFree(c.ti,c.ri);return f===null?'':`<div class="notice">이 박스에서 지금 ${both?'포장+동별로':'동별에'} 올릴 수 있는 수량: <b>${f}</b>${both?'':' (포장한 만큼만 가능)'}</div>`;})()+(bs&&bs!=='done'&&bs!=='part'&&bs!=='ready'?'<div class="notice">⏳ 이 박스는 아직 작업(가공)이 끝나지 않았습니다.</div>':''),blocked:false,tail:''};
}
function packExtra(bi,can){
 const b=SITE.pack[bi];let h='';
 {const c=capOf(bi),rem=b.n-Eof(bi);if(c!==null&&rem>0&&c<rem)h+=`<div class="bnote" style="background:#ffe9e6;border-color:#b3261e;color:#8c1d18">⚠ 가공한 수량이 모자라 지금은 <b>${c}박스</b>까지만 포장할 수 있습니다. (가공보다 많이 포장하면 저장되지 않습니다)</div>`;}
 const short=b.lines.filter(l=>lineShort(l)>0).map(l=>`<div>· <b>${esc(l.edge||l.model)}</b> ${esc(l.name)} — 작업 ${wD[wIdx[l.work]]}/${SITE.work[wIdx[l.work]].q} (부족 −${lineShort(l)})</div>`).join('');
 if(OVR.has(b.box))h+='<div class="bnote">🔓 관리자 예외 승인됨 — 작업이 덜 끝났어도 포장할 수 있습니다.</div>';
 else if(!can)h+=`<div class="notice">⏳ 작업이 더 필요합니다. (모자란 수량이 총수량의 ${(SITE&&SITE.short)||12}% 이내여야 포장 가능)</div>`;
 else if(short)h+='<div class="bnote" style="background:#ffe9e6;border-color:#b3261e;color:#8c1d18">⚠ 일부 작업이 덜 됐지만 포장은 가능합니다.</div>';
 if(short)h+=`<div class="info" style="font-size:14px">${short}</div>`;
 if(ADMIN){
  if(OVR.has(b.box))h+=`<div class="pin"><input id="pin" type="password" inputmode="numeric" placeholder="관리자 번호"><button class="btn adm2" onclick="setOvr('${esc(b.box)}',false)">예외 해제</button></div>`;
  else if(!can)h+=`<div class="pin"><input id="pin" type="password" inputmode="numeric" placeholder="관리자 번호"><button class="btn adm2" onclick="setOvr('${esc(b.box)}',true)">예외 승인 (포장 시작 허용)</button></div>`;
 }
 return h;
}
async function setOvr(box,on){
 const pin=$('pin')?$('pin').value:'';if(!pin){msg('관리자 번호를 입력해 주세요');return;}
 if(busy)return;busy=true;
 try{const res=await post({action:'ovr',po:PO,box,on,pin});busy=false;
  if(res.ok){OVR=new Set(res.ovr||[]);toast(on?'예외 승인했습니다':'예외를 해제했습니다',3000);closeM();refresh();}
  else msg(res.msg||'처리하지 못했습니다');
 }catch(e){busy=false;msg('서버에 연결되지 않았습니다. 다시 눌러 주세요.');}
}
function openModal(c){cur=c;$('mb').innerHTML='';renderModal();$('modal').style.display='flex';}
function renderModal(){
 if(!cur)return;const x=ctxOf(cur),q=x.q,d=x.d,left=q-d;
 const keep=$('n')?$('n').value:'',keepM=$('m')?$('m').textContent:'',keepP=$('pin')?$('pin').value:'';
 $('mb').innerHTML=`<h2>${x.title}</h2><div class="info" style="font-size:30px;font-weight:900;color:var(--navy)">${x.head}</div>${x.sub?`<div class="info">${x.sub}</div>`:''}${x.extra}
 <div class="big">전체 <b>${q}</b>${x.unit} · 지금까지 <b>${d}</b> · <b style="color:#c0392b">남은 ${left}</b></div>
 <button class="btn ok" ${left===0||busy||x.blocked||x.noAll?'disabled':''} onclick="act('add',${left})">전부 완료 (남은 ${left}${x.unit})</button>
 <div class="lbl">일부만 했을 때 — 이번에 ${x.what} 개수</div>
 <div class="row"><input id="n" type="number" inputmode="numeric" min="1" placeholder="개수" value="${esc(keep)}"><button class="btn sec" ${busy||x.blocked?'disabled':''} onclick="act('add',parseInt($('n').value))">추가</button></div>
 <div class="msg" id="m">${esc(keepM)}</div>${x.tail?`<div class="lbl">${x.tail}</div>`:''}
 <button class="btn warn" ${d>0&&!busy?'':'disabled'} onclick="act('undo')">직전 입력 취소</button>
 <div class="lbl">수량 직접 수정 — 지금까지 ${x.what} 개수</div>
 <div class="row"><input id="e" type="number" inputmode="numeric" min="0" max="${q}" value="${d}"><button class="btn sec" ${busy||x.blocked||(both&&x.both)?'disabled':''} onclick="act('set',parseInt($('e').value))">저장</button></div>
 <button class="btn sec" onclick="closeM()">닫기</button>`;
 if($('pin')&&keepP)$('pin').value=keepP;
}
function closeM(){$('modal').style.display='none';cur=null;$('mb').innerHTML='';}
function msg(t){const m=$('m');if(m)m.textContent=t;}
function setRaw(c,v){if(c.k==='w')wD[c.i]=v;else if(c.k==='p')pD[c.i]=v;else dD[c.ti][c.ri][c.ci]=v;}
async function act(kind,v){
 if(!cur||busy)return;const x=ctxOf(cur),q=x.q;
 if(kind==='add'&&!(v>0)){msg('개수를 입력해 주세요');return;}
 if(kind==='set'&&!(v>=0&&v<=q)){msg(`0~${q} 사이로 입력해 주세요`);return;}
 busy=true;renderModal();
 const body=Object.assign({action:kind,po:PO},x.body);if(kind==='add')body.n=v;if(kind==='set')body.value=v;if(both&&x.both&&kind==='add')body.both=true;
 try{const res=await post(body);busy=false;
  if(res.d!==undefined)setRaw(cur,res.d);if(res.cells)applyCells(res.cells);
  if(res.ok){netOk(true);const was=cur;closeM();refresh();if(res.warn)toast(res.warn,6000);else if(body.both&&res.cells&&kind==='add')toast('동별 +'+body.n+' · 포장 +'+body.n+' 같이 처리했습니다',3500);}else{refresh();renderModal();msg(res.msg||'저장하지 못했습니다');}
 }catch(e){busy=false;netOk(false);renderModal();msg('서버에 연결되지 않아 저장되지 않았습니다. 다시 눌러 주세요.');}
}
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeM();});

// ---------- 여러 칸 선택 ----------
function pruneSel(){[...sel].forEach(k=>{
 if(k[0]==='w'){const i=wIdx[k.slice(2)];if(i===undefined||wDone(i))sel.delete(k);}
 else if(k[0]==='p'){const i=pIdx[k.slice(2)];if(i===undefined||pstat(i)==='done'||!packable(i))sel.delete(k);}
 else{const [ti,ri,ci]=k.slice(2).split('_').map(Number);if(dD[ti][ri][ci]>=SITE.dong[ti].rows[ri].q[ci])sel.delete(k);}});}
function toggleSel(){selMode=!selMode;if(!selMode)clearSel(true);document.body.classList.toggle('selmode',selMode);$('selbtn').className='hb'+(selMode?' on':'');$('selbtn').textContent=selMode?'선택 모드 끄기':'여러 칸 선택';bmsg='';refresh();}
function clearSel(silent){sel.clear();bmsg='';if(!silent)refresh();}
function selLabel(){return mode==='work'?'줄':mode==='pack'?'박스':'칸';}
function updateBar(){
 const b=$('bar');if(!selMode){b.style.display='none';return;}b.style.display='flex';
 const n=sel.size,u=selLabel(),verb=mode==='pack'?'포장 완료':'완료';
 b.innerHTML=(bmsg?`<div class="bm">${esc(bmsg)}</div>`:'')+
 `<button class="btn ok" ${n&&!busy?'':'disabled'} onclick="bulkDone()">${n?`선택한 ${n}${u} 전부 ${verb}`:`${verb}할 ${mode==='pack'?'박스를':mode==='work'?'줄을':'칸을'} 눌러 선택하세요`}</button>`+
 `<button class="btn sec" ${n?'':'disabled'} onclick="clearSel()">선택 해제</button>`+
 (lastBatch?`<button class="btn warn" ${busy?'disabled':''} onclick="bulkUndo()">방금 일괄 입력 취소</button>`:'');
}
function itemsOfSel(){return [...sel].map(k=>{
 if(k[0]==='w')return {type:'작업',box:k.slice(2),ci:0};
 if(k[0]==='p')return {type:'포장',box:k.slice(2),ci:0};
 const [ti,ri,ci]=k.slice(2).split('_').map(Number);return {type:SITE.dong[ti].name,box:SITE.dong[ti].rows[ri].box,ci};});}
function applyCells(cells){cells.forEach(c=>{
 if(c.type==='작업'){const i=wIdx[c.box];if(i!==undefined)wD[i]=c.d;}
 else if(c.type==='포장'){const i=pIdx[c.box];if(i!==undefined)pD[i]=c.d;}
 else{const ti=SITE.dong.findIndex(T=>T.name===c.type);if(ti<0)return;const ri=SITE.dong[ti].rows.findIndex(r=>r.box===c.box);if(ri>=0)dD[ti][ri][c.ci]=c.d;}});}
async function bulkDone(){
 if(!sel.size||busy)return;const items=itemsOfSel();busy=true;bmsg='';updateBar();
 try{const bd={action:'bulk',po:PO,items};if(both&&mode==='dong')bd.both=true;const res=await post(bd);busy=false;
  if(res.ok){applyCells(res.cells);sel.clear();lastBatch=res.batch;bmsg=res.cells.filter(c=>c.type!=='포장'||mode==='pack').length+selLabel()+' 완료했습니다'+(bd.both?' (포장에도 같이 반영)':'')+(res.warn?' · '+res.warn:'');netOk(true);}
  else{bmsg=res.msg||'저장하지 못했습니다';poll();}
 }catch(e){busy=false;netOk(false);bmsg='서버에 연결되지 않아 저장되지 않았습니다. 다시 눌러 주세요.';}
 refresh();
}
async function bulkUndo(){
 if(!lastBatch||busy)return;busy=true;updateBar();
 try{const res=await post({action:'bulkundo',batch:lastBatch});busy=false;
  if(res.ok){applyCells(res.cells);bmsg=res.cells.length+'개를 되돌렸습니다';lastBatch=null;}else bmsg=res.msg||'되돌리지 못했습니다';
 }catch(e){busy=false;bmsg='서버에 연결되지 않았습니다. 다시 눌러 주세요.';}
 refresh();
}
document.documentElement.style.setProperty('--s','.5');
route();
</script></body></html>
